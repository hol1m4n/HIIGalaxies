# -----------------------------------------------------------------
# Parametrización 2: H0, Omega_m, w_DE (constante) -- wCDM plano.
# Omega_m se muestrea directamente y omega_cdm se recalcula en cada
# paso para mantener consistencia (omega_cdm = Om_m*h^2 - omega_b).
# -----------------------------------------------------------------
theory:
  classy:
    extra_args:
      non_linear: none
      Omega_Lambda: 0.0     # fuerza el fluido oscuro en vez de Lambda
      use_ppf: 'yes'        # necesario si w cruza -1

params:
  H0:
    prior: {min: 50, max: 90}
    ref: {dist: norm, loc: 70, scale: 3}
    proposal: 2
    latex: H_0
  omega_b: 0.02237
  n_s: 0.9649
  ln10^{10}A_s: 3.044
  tau_reio: 0.0544
  Omega_m:
    prior: {min: 0.05, max: 0.6}
    ref: {dist: norm, loc: 0.3, scale: 0.02}
    proposal: 0.01
    latex: \Omega_m
  omega_cdm:
    value: 'lambda Omega_m, omega_b, H0: Omega_m*(H0/100)**2 - omega_b'
    derived: false
  w0_fld:
    prior: {min: -2.0, max: -0.3}
    ref: {dist: norm, loc: -1.0, scale: 0.05}
    proposal: 0.02
    latex: w_{DE}
  wa_fld: 0.0

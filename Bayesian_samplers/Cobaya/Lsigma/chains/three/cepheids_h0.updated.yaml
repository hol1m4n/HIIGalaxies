    error_kind: sigma_w
    zmax: 7.0
    hbeta_zero_point: 100.19477738511641
    type: []
    speed: -1
    stop_at_error: false
    version: null
    python_path: /home/holman/HIIGalaxies/Bayesian_samplers/Cobaya/Lsigma/
    input_params:
    - alpha_ls
    - beta_ls
    - H0
    output_params: []
params:
  alpha_ls:
    prior:
      min: 20.0
      max: 40.0
    ref:
      dist: norm
      loc: 30.0
      scale: 0.5
    proposal: 0.2
    latex: \alpha
  beta_ls:
    prior:
      min: 0.0
      max: 10.0
    ref:
      dist: norm
      loc: 5.0
      scale: 0.3
    proposal: 0.1
    latex: \beta
  H0:
    prior:
      min: 50
      max: 90
    ref:
      dist: norm
      loc: 70
      scale: 3
    proposal: 2
    latex: H_0
  omega_b:
    value: 0.02237
    renames:
    - omegabh2
  n_s:
    value: 0.9649
    renames:
    - ns
  ln10^{10}A_s:
    value: 3.044
  tau_reio:
    value: 0.0544
    renames:
    - tau
  Omega_m:
    prior:
      min: 0.05
      max: 0.6
    ref:
      dist: norm
      loc: 0.3
      scale: 0.02
    proposal: 0.01
    latex: \Omega_m
    renames:
    - omegam
  omega_cdm:
    value: 'lambda Omega_m, omega_b, H0: Omega_m*(H0/100)**2 - omega_b'
    derived: false
    renames:
    - omegach2
  w0_fld:
    prior:
      min: -2.0
      max: -0.3
    ref:
      dist: norm
      loc: -1.0
      scale: 0.05
    proposal: 0.02
    latex: w_{DE}
    renames:
    - w
  wa_fld:
    value: 0.0
    renames:
    - wa

# CPL: cmb_hiig_bao

likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE: null
  planck_2018_lensing.clik: null
  lsigma_hiig_lensing_likelihood.LSigmaHIIGLensing:
    python_path: /home/holman/HIIGalaxies/Bayesian_samplers/Cobaya/MAIN
    # These files are the names used by the successful lensing MultiNest run.
    # Replace with absolute paths if they are stored elsewhere.
    data_file: Compilation2026_main.csv
    anchor_file: GEHR_base.csv
    anchor_cov_file: null

    zmax: 14.0
    include_logdet: true
    correlate_host_mu: true

    # Optional non-lensing additions to the Gaussian core.
    sigma_v_pec_kms: 0.0
    sigma_sys_mag: 0.0
    sigma_sys_column: null

    # Chavez et al. (2026) weak-lensing prescription.
    apply_lensing: true
    lensing_sigma_coeff: 0.088
    lensing_zmin: 0.0
    lensing_zmax: 14.0

    # Production: exact analytic Gaussian convolution.
    # For a direct check against five_par_lensing_test.py use:
    #   lensing_method: gh
    #   gh_order: 20
    lensing_method: analytic
    gh_order: 20
  bao.desi_dr2: null

theory:
  classy:
    extra_args:
      Omega_k: 0.0
      Omega_Lambda: 0.0
      fluid_equation_of_state: CLP
      use_ppf: 'yes'
      N_ncdm: 1
      N_ur: 2.0328
      m_ncdm: 0.06
      non linear: hmcode

params:
  logA:
    prior: {min: 1.61, max: 3.91}
    ref: {dist: norm, loc: 3.05, scale: 0.01}
    proposal: 0.005
    latex: \log(10^{10} A_s)
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_s

  n_s:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 0.965, scale: 0.004}
    proposal: 0.002
    latex: n_s

  omega_b:
    prior: {min: 0.005, max: 0.1}
    ref: {dist: norm, loc: 0.0224, scale: 0.0002}
    proposal: 0.0001
    latex: \Omega_b h^2

  omega_cdm:
    prior: {min: 0.001, max: 0.99}
    ref: {dist: norm, loc: 0.120, scale: 0.002}
    proposal: 0.001
    latex: \Omega_c h^2

  # Planck-friendly acoustic-scale parameterization (as in the 2021 analysis).
  # CLASS derives H0 from theta_s_100; H0 is still saved and can be used by
  # the external local-H0 likelihood.
  theta_s_100:
    prior: {min: 0.5, max: 10.0}
    ref: {dist: norm, loc: 1.0416, scale: 0.0004}
    proposal: 0.0002
    latex: 100\theta_s

  H0:
    latex: H_0

  tau_reio:
    prior: {min: 0.01, max: 0.8}
    ref: {dist: norm, loc: 0.055, scale: 0.01}
    proposal: 0.005
    latex: \tau_{\rm reio}

  Omega_m:
    latex: \Omega_m
  sigma8:
    latex: \sigma_8
  w0_fld:
    prior: {min: -2.0, max: 0.0}
    ref: {dist: norm, loc: -1.0, scale: 0.05}
    proposal: 0.03
    latex: w_0

  wa_fld:
    prior: {min: -4.0, max: 2.0}
    ref: {dist: norm, loc: 0.0, scale: 0.15}
    proposal: 0.08
    latex: w_a
  alpha_ls:
    prior: {min: 32.5, max: 34.5}
    ref: {dist: norm, loc: 33.2, scale: 0.15}
    proposal: 0.03
    latex: \alpha

  beta_ls:
    prior: {min: 4.5, max: 5.5}
    ref: {dist: norm, loc: 5.0, scale: 0.10}
    proposal: 0.02
    latex: \beta

  # Fixed at zero to match the no-extra-intrinsic-scatter setup.
  # It can later be freed as a robustness test.
  sigma_int:
    value: 0.0
    latex: \sigma_{\rm int}

sampler:
  mcmc:
    covmat: auto
    drag: true
    oversample_power: 0.4
    proposal_scale: 1.9
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2

output: chains/cpl/cmb_hiig_bao

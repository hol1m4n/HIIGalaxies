    - sigma_int
    output_params: []
params:
  logA:
    prior:
      min: 1.61
      max: 3.91
    ref:
      dist: norm
      loc: 3.05
      scale: 0.01
    proposal: 0.005
    latex: \log(10^{10} A_s)
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_s
    derived: true
    renames:
    - As
  n_s:
    prior:
      min: 0.8
      max: 1.2
    ref:
      dist: norm
      loc: 0.965
      scale: 0.004
    proposal: 0.002
    latex: n_s
    renames:
    - ns
  omega_b:
    prior:
      min: 0.005
      max: 0.1
    ref:
      dist: norm
      loc: 0.0224
      scale: 0.0002
    proposal: 0.0001
    latex: \Omega_b h^2
    renames:
    - omegabh2
  omega_cdm:
    prior:
      min: 0.001
      max: 0.99
    ref:
      dist: norm
      loc: 0.12
      scale: 0.002
    proposal: 0.001
    latex: \Omega_c h^2
    renames:
    - omegach2
  theta_s_100:
    prior:
      min: 0.5
      max: 10.0
    ref:
      dist: norm
      loc: 1.0416
      scale: 0.0004
    proposal: 0.0002
    latex: 100\theta_s
  H0:
    latex: H_0
    derived: true
  tau_reio:
    prior:
      min: 0.01
      max: 0.8
    ref:
      dist: norm
      loc: 0.055
      scale: 0.01
    proposal: 0.005
    latex: \tau_{\rm reio}
    renames:
    - tau
  Omega_m:
    latex: \Omega_m
    derived: true
    renames:
    - omegam
  sigma8:
    latex: \sigma_8
    derived: true
  alpha_ls:
    prior:
      min: 32.5
      max: 34.5
    ref:
      dist: norm
      loc: 33.2
      scale: 0.15
    proposal: 0.03
    latex: \alpha
  beta_ls:
    prior:
      min: 4.5
      max: 5.5
    ref:
      dist: norm
      loc: 5.0
      scale: 0.1
    proposal: 0.02
    latex: \beta
  sigma_int:
    derived: false
    value: 0.0
    latex: \sigma_{\rm int}
sampler:
  mcmc:
    sampler_type: mcmc
    supports_periodic_params: true
    burn_in: 0
    max_tries: 40d
    covmat: auto
    covmat_params: null
    proposal_scale: 1.9
    output_every: 60s
    learn_every: 40d
    temperature: 1
    learn_proposal: true
    learn_proposal_Rminus1_max: 2.0
    learn_proposal_Rminus1_max_early: 30.0
    learn_proposal_Rminus1_min: 0.0
    max_samples: .inf
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2
    Rminus1_cl_level: 0.95
    Rminus1_single_split: 4
    measure_speeds: true
    oversample_power: 0.4
    oversample_thin: true
    drag: true
    blocking:
    - - 1
      - - logA
        - n_s
        - omega_b
        - omega_cdm
        - theta_s_100
        - tau_reio
    - - 11
      - - alpha_ls
        - beta_ls
    callback_function: null
    callback_every: null
    seed: null
    check_every: null
    oversample: null
    drag_limits: null
    fallback_covmat_scale: 4
    version: 3.6.2

    - A_planck
    output_params: []
  lsigma_hiig_likelihood.LSigmaHIIG:
    data_file: Compilation2026.csv
    anchor_file: GEHR_TRGB.csv
    anchor_cov_file: null
    data_host_column: GEHR_id
    origin_column: origin_id
    z_or_mu_column: z_or_mu
    z_or_mu_error_column: e_z_or_e_mu
    log_sigma_column: log_sigma
    e_log_sigma_column: e_log_sigma
    log_flux_column: log_f_Hbeta
    e_log_flux_column: e_log_f_Hbeta
    anchor_host_column: Galaxia
    anchor_mu_column: mu_w
    anchor_error_column: sigma_w
    mu_constant: 100.19477738511641
    zmax: 7.0
    include_logdet: true
    correlate_host_mu: true
    sigma_v_pec_kms: 0.0
    type: []
    speed: -1
    stop_at_error: false
    version: null
    python_path: .
    input_params:
    - alpha_ls
    - beta_ls
    - sigma_int
    output_params: []
params:
  logA:
    prior:
      min: 1.61
      max: 3.91
    ref:
      dist: norm
      loc: 3.045
      scale: 0.01
    proposal: 0.001
    latex: \log(10^{10}A_s)
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_s
    derived: true
    renames:
    - As
  n_s:
    prior:
      min: 0.8
      max: 1.2
    ref:
      dist: norm
      loc: 0.965
      scale: 0.004
    proposal: 0.002
    latex: n_s
    renames:
    - ns
  omega_b:
    prior:
      min: 0.005
      max: 0.1
    ref:
      dist: norm
      loc: 0.0224
      scale: 0.0001
    proposal: 0.0001
    latex: \Omega_b h^2
    renames:
    - omegabh2
  tau_reio:
    prior:
      min: 0.01
      max: 0.8
    ref:
      dist: norm
      loc: 0.055
      scale: 0.006
    proposal: 0.003
    latex: \tau_{\rm reio}
    renames:
    - tau
  m_ncdm:
    value: 0.06
    renames: mnu
  alpha_ls:
    prior:
      min: 20.0
      max: 40.0
    ref:
      dist: norm
      loc: 33.0
      scale: 0.5
    proposal: 0.1
    latex: \alpha_{L\sigma}
  beta_ls:
    prior:
      min: 0.0
      max: 10.0
    ref:
      dist: norm
      loc: 5.0
      scale: 0.2
    proposal: 0.05
    latex: \beta_{L\sigma}
  sigma_int:
    derived: false
    value: 0.0
  H0:
    prior:
      min: 50.0
      max: 100.0
    ref:
      dist: norm
      loc: 70.0
      scale: 2.0
    proposal: 0.5
    latex: H_0
  Omega_m:
    value: 0.3
    latex: \Omega_m
    renames:
    - omegam
  A_planck:
    prior:
      dist: norm
      loc: 1
      scale: 0.0025
    ref:
      dist: norm
      loc: 1
      scale: 0.002
    proposal: 0.0005
    latex: y_\mathrm{cal}
    renames: calPlanck
  chi2__CMB:
    latex: \chi^2_\mathrm{CMB}
    derived: true
sampler:
  mcmc:
    sampler_type: mcmc
    supports_periodic_params: true
    burn_in: 0
    max_tries: 40d
    covmat: auto
    covmat_params: null
    proposal_scale: 1.9
    output_every: 60s
    learn_every: 40d
    temperature: 1
    learn_proposal: true
    learn_proposal_Rminus1_max: 2.0
    learn_proposal_Rminus1_max_early: 30.0
    learn_proposal_Rminus1_min: 0.0
    max_samples: .inf
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2
    Rminus1_cl_level: 0.95
    Rminus1_single_split: 4
    measure_speeds: true
    oversample_power: 0.4
    oversample_thin: true
    drag: true
    blocking:
    - - 1
      - - logA
        - n_s
        - omega_b
        - tau_reio
        - H0
    - - 9
      - - A_planck
    - - 9
      - - alpha_ls
        - beta_ls
    callback_function: null
    callback_every: null
    seed: null
    check_every: null
    oversample: null
    drag_limits: null
    fallback_covmat_scale: 4
    version: 3.6.2
output: planck_hiig_trgb
test: true
version: 3.6.2

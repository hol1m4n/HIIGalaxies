# Cobaya + CLASS configuration for the L-sigma / Planck analysis.
# Run from the package root, e.g.
#   cobaya-run yaml/wCDM/planck.yaml --test
# then
#   mpirun -np 4 cobaya-run yaml/wCDM/planck.yaml
# If your Cobaya packages are not in the default location, add e.g.
# packages_path: /path/to/cobaya_packages

packages_path: /home/holman/cobaya_packages

theory:
  classy:
    extra_args:
      non linear: hmcode
      Omega_k: 0.0
      N_ncdm: 1
      N_ur: 2.0328
      Omega_Lambda: 0.0
      fluid_equation_of_state: CLP
      use_ppf: 'yes'
      wa_fld: 0.0
likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_highl_plik.TTTEEE_lite_native: null
  planck_2018_lensing.native: null
params:
  logA:
    prior:
      min: 1.61
      max: 3.91
    ref:
      dist: norm
      loc: 3.045
      scale: 0.01
    proposal: 0.001
    latex: \log(10^{10}A_s)
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_s
  n_s:
    prior:
      min: 0.8
      max: 1.2
    ref:
      dist: norm
      loc: 0.965
      scale: 0.004
    proposal: 0.002
    latex: n_s
  omega_b:
    prior:
      min: 0.005
      max: 0.1
    ref:
      dist: norm
      loc: 0.0224
      scale: 0.0001
    proposal: 0.0001
    latex: \Omega_b h^2
  tau_reio:
    prior:
      min: 0.01
      max: 0.8
    ref:
      dist: norm
      loc: 0.055
      scale: 0.006
    proposal: 0.003
    latex: \tau_{\rm reio}
  m_ncdm:
    value: 0.06
    renames: mnu
  H0:
    prior:
      min: 50.0
      max: 100.0
    ref:
      dist: norm
      loc: 70.0
      scale: 2.0
    proposal: 0.5
    latex: H_0
  Omega_m:
    prior:
      min: 0.05
      max: 0.6
    ref:
      dist: norm
      loc: 0.3
      scale: 0.03
    proposal: 0.01
    latex: \Omega_m
  w0_fld:
    prior:
      min: -2.5
      max: -0.3
    ref:
      dist: norm
      loc: -0.95
      scale: 0.05
    proposal: 0.03
    latex: w_{\rm DE}
sampler:
  mcmc:
    drag: true
    oversample_power: 0.4
    proposal_scale: 1.9
    covmat: auto
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2
output: chains/wCDM/planck
resume: true
